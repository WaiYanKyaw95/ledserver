<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div id="login-section">
        <div class="card p-4" style="width: 300px">
            <h5 class="mb-4 text-center">LED Server</h5>
            <form id="login-form" class="d-flex flex-column gap-3">
                <input type="text" placeholder="username" id="username" class="form-control">
                <input type="password" placeholder="password" id="password" class="form-control">
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div> 
    </div>
    <div id="led-section" style="display:none">
        <div class="card p-4 text-center" style="width: 300px">
            <h5 class="mb-4">LED Control</h5>
            <div class="d-flex gap-3 justify-content-center mb-3">
                <button type="button" id="led-on" class="btn btn-success w-100">ON</button>
                <button type="button" id="led-off" class="btn btn-danger w-100">OFF</button>
            </div>
            <button type="button" id="logout" class="btn btn-secondary">Logout</button>
        </div>
    </div>
    <script>
        let token = null

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault()  // stop the page from reloading

            const username = document.getElementById('username').value
            const password = document.getElementById('password').value

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(function(response) {
                return response.json()
            })
            .then(function(data) {
                if (data.token) {
                    token = data.token
                    // hide login section
                    document.getElementById('login-section').style.display = 'none'
                    // show LED section
                    document.getElementById('led-section').style.display = 'block'
                } else {
                    alert('Invalid credentials')
                }
            })
        })

        document.getElementById('led-on').addEventListener('click', function() {
            fetch('/led/on', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            })
        })

        document.getElementById('led-off').addEventListener('click', function() {
            fetch('/led/off', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            })
        })

        document.getElementById('logout').addEventListener('click', function() {
            fetch('/logout', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(function() {
                token = null
                document.getElementById('username').value = ''
                document.getElementById('password').value = ''
                document.getElementById('led-section').style.display = 'none'
                document.getElementById('login-section').style.display = 'block'
            })
        })
    </script>
</body>
</html>
